name: medsafetyassistant-integration

services:
  neo4j-integration:
    image: neo4j:5.26.28
    container_name: medsafety-neo4j-integration
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: neo4j/medsafety-test
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p medsafety-test 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: "no"
